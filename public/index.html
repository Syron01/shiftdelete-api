<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShiftDelete.Net · Haberler</title>
<style>
  :root {
    --bg:#0d1117; --bg2:#161b22; --bg3:#21262d; --border:#30363d;
    --text:#e6edf3; --muted:#8b949e; --accent:#8b5cf6; --accent2:#a78bfa;
    --green:#3fb950; --red:#f85149;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6;
  }
  a { color:inherit; }

  /* ---------- Header ---------- */
  header {
    position:sticky; top:0; z-index:50;
    background:rgba(13,17,23,.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    padding:12px 16px;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .logo { font-weight:800; font-size:1.05rem; cursor:pointer; white-space:nowrap; }
  .logo span { color:var(--accent2); }
  .searchbar {
    flex:1; min-width:160px; max-width:480px;
    display:flex; background:var(--bg2); border:1px solid var(--border); border-radius:999px;
  }
  .searchbar input {
    flex:1; background:none; border:none; color:var(--text);
    padding:9px 16px; font-size:.92rem; outline:none;
  }
  .searchbar button {
    background:var(--accent); border:none; color:#fff; border-radius:0 999px 999px 0;
    padding:0 18px; cursor:pointer; font-size:.9rem;
  }
  .conn { font-size:.75rem; color:var(--muted); display:flex; align-items:center; gap:6px; cursor:pointer; }
  .conn .dot { width:8px; height:8px; border-radius:50%; background:var(--red); }
  .conn.ok .dot { background:var(--green); }

  /* ---------- Tabs ---------- */
  .tabs {
    display:flex; gap:6px; padding:14px 16px 0; overflow-x:auto;
    max-width:1200px; margin:0 auto; width:100%;
  }
  .tab {
    border:1px solid var(--border); background:var(--bg2); color:var(--muted);
    padding:7px 16px; border-radius:999px; font-size:.85rem; cursor:pointer; white-space:nowrap;
  }
  .tab.active { background:var(--accent); border-color:var(--accent); color:#fff; }

  /* ---------- Content ---------- */
  .container { max-width:1200px; margin:0 auto; padding:18px 16px 60px; }
  .grid {
    display:grid; gap:16px;
    grid-template-columns:repeat(auto-fill, minmax(270px, 1fr));
    margin-top:14px;
  }
  .card {
    background:var(--bg2); border:1px solid var(--border); border-radius:12px;
    overflow:hidden; cursor:pointer; transition:transform .15s, border-color .15s;
    display:flex; flex-direction:column;
  }
  .card:hover { transform:translateY(-3px); border-color:var(--accent); }
  .card img {
    width:100%; aspect-ratio:16/9; object-fit:cover; background:var(--bg3);
    display:block;
  }
  .card .body { padding:12px 14px 14px; flex:1; display:flex; flex-direction:column; gap:6px; }
  .card h3 { font-size:.95rem; line-height:1.45; }
  .card .meta { font-size:.75rem; color:var(--muted); margin-top:auto; display:flex; gap:10px; flex-wrap:wrap; }
  .card .cat { color:var(--accent2); }

  /* ---------- Pager ---------- */
  .pager { display:flex; gap:10px; justify-content:center; margin-top:26px; align-items:center; }
  .pager button {
    background:var(--bg2); border:1px solid var(--border); color:var(--text);
    padding:8px 18px; border-radius:8px; cursor:pointer; font-size:.9rem;
  }
  .pager button:disabled { opacity:.4; cursor:default; }
  .pager span { color:var(--muted); font-size:.85rem; }

  /* ---------- Article view ---------- */
  .article { max-width:760px; margin:0 auto; }
  .back {
    background:none; border:none; color:var(--accent2); cursor:pointer;
    font-size:.9rem; padding:6px 0;
  }
  .article h1 { font-size:1.5rem; margin:12px 0 8px; line-height:1.4; }
  .article .meta { color:var(--muted); font-size:.83rem; margin-bottom:16px; display:flex; gap:12px; flex-wrap:wrap; }
  .article img.cover { width:100%; border-radius:12px; margin-bottom:18px; }
  .article .content { font-size:.98rem; color:#d5dbe3; }
  .article .content p { margin-bottom:14px; }
  .article .content img { max-width:100%; border-radius:10px; margin:8px 0; }
  .article .content a { color:var(--accent2); }
  .article .content h2,.article .content h3 { margin:20px 0 10px; }
  .article .content ul,.article .content ol { margin:0 0 14px 22px; }

  /* ---------- Generic list rows (arama/etiket/yazar vs.) ---------- */
  .rows { display:grid; gap:10px; margin-top:14px; }
  .row {
    background:var(--bg2); border:1px solid var(--border); border-radius:10px;
    padding:12px 16px; cursor:pointer; font-size:.92rem;
    display:flex; justify-content:space-between; gap:10px; align-items:baseline; flex-wrap:wrap;
  }
  .row:hover { border-color:var(--accent); }
  .row .sub { color:var(--muted); font-size:.78rem; }

  /* ---------- Dev panel ---------- */
  details.dev {
    margin-top:30px; border:1px solid var(--border); border-radius:10px;
    background:var(--bg2); padding:12px 16px;
  }
  details.dev summary { cursor:pointer; color:var(--muted); font-size:.85rem; }
  details.dev .url { font-family:monospace; font-size:.8rem; color:var(--accent2); word-break:break-all; margin:10px 0; }
  details.dev pre {
    background:var(--bg); border:1px solid var(--border); border-radius:8px;
    padding:12px; font-size:.78rem; overflow:auto; max-height:360px; margin-top:8px;
  }

  /* ---------- States ---------- */
  .state { text-align:center; padding:70px 20px; color:var(--muted); }
  .state .big { font-size:2.4rem; margin-bottom:10px; }
  .state h2 { color:var(--text); margin-bottom:8px; font-size:1.1rem; }
  .state code { background:var(--bg2); padding:2px 8px; border-radius:6px; font-size:.85rem; }
  .spin {
    width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--accent);
    border-radius:50%; animation:r 1s linear infinite; margin:0 auto 16px;
  }
  @keyframes r { to { transform:rotate(360deg); } }

  footer {
    text-align:center; padding:24px 14px 34px; color:var(--muted);
    font-size:.78rem; border-top:1px solid var(--border);
  }
  footer a { color:var(--accent2); text-decoration:none; }
</style>
</head>
<body>

<header>
  <div class="logo" onclick="goHome()">📰 shiftdelete<span>.api</span></div>
  <form class="searchbar" onsubmit="doSearch(event)">
    <input id="q" placeholder="Haber ara… (örn. iphone)">
    <button type="submit">Ara</button>
  </form>
  <div class="conn" id="conn" onclick="showConnModal()">
    <span class="dot"></span><span id="connText">bağlanıyor…</span>
  </div>
</header>

<div class="tabs" id="tabs"></div>
<div class="container" id="app"><div class="state"><div class="spin"></div>yükleniyor…</div></div>

<footer>
  Resmi değildir · tüm içerik hakları <a href="https://shiftdelete.net" target="_blank" rel="noopener">ShiftDelete.Net</a>'e aittir ·
  kaynağında okumak için: <a href="https://shiftdelete.net" target="_blank" rel="noopener">shiftdelete.net</a> 💙
</footer>

<script>
/* ---------- API base ---------- */
let BASE = '';
const isStatic = !!(location.hostname.endsWith('.github.io') || location.protocol === 'file:');
if (isStatic) BASE = (localStorage.getItem('apiBase') || 'http://localhost:3000').replace(/\/+$/, '');
const api = (p) => BASE + p;

/* ---------- Conn badge ---------- */
async function checkConn() {
  const el = document.getElementById('conn'), t = document.getElementById('connText');
  try {
    const r = await fetch(api('/api/v1/health'), { signal: AbortSignal.timeout(4000) });
    if (!r.ok) throw 0;
    el.classList.add('ok'); t.textContent = 'bağlı';
  } catch {
    el.classList.remove('ok');
    t.textContent = isStatic ? 'bağlantı yok' : 'sunucu kapalı';
  }
}

function showConnModal() {
  const cur = isStatic ? (localStorage.getItem('apiBase') || 'http://localhost:3000') : '';
  const v = prompt(
    'API sunucu adresi.\n\n' +
    (isStatic
      ? 'Canlı veri için bilgisayarında projeyi başlat:\nnpm start\n\nSonra adresi gir (örn. http://localhost:3000):'
      : 'Yerel sunucu kullanılıyor. Başlatmak için: npm start'),
    cur
  );
  if (v !== null && isStatic) { localStorage.setItem('apiBase', v.trim().replace(/\/+$/, '')); location.reload(); }
}

/* ---------- Helpers ---------- */
const app = document.getElementById('app');
let lastJSON = null, lastURL = '';

async function get(path, quiet) {
  lastURL = api(path);
  const r = await fetch(lastURL);
  const j = await r.json();
  lastJSON = j;
  if (!r.ok) throw new Error((j && j.error) || ('HTTP ' + r.status));
  return j;
}
function esc(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function spinner() { app.innerHTML = '<div class="state"><div class="spin"></div>yükleniyor…</div>'; }
function failView(e) {
  checkConn();
  app.innerHTML = `
    <div class="state">
      <div class="big">🔌</div>
      <h2>Veri alınamadı</h2>
      <p>${esc(e.message || 'Hata')}</p>
      ${isStatic ? `<p style="margin-top:12px">Bilgisayarında API'yi başlat:<br><code>npm start</code><br>sonra üstteki bağlantı noktasından adresi gir.</p>` : `<p style="margin-top:12px">Sunucu açık mı? <code>npm start</code></p>`}
    </div>`;
}
function fmtDate(d) {
  if (!d) return '';
  try { return new Date(d).toLocaleDateString('tr-TR', { day:'numeric', month:'long', year:'numeric' }); } catch { return d; }
}
function devBlock() {
  if (!lastURL) return '';
  return `
    <details class="dev">
      <summary>🛠️ Geliştirici: ham JSON ve endpoint</summary>
      <div class="url">${esc(lastURL)}</div>
      <button class="back" onclick="navigator.clipboard.writeText('${esc(lastURL).replace(/'/g,"\\'")}')" style="color:var(--accent2)">📋 URL kopyala</button>
      <pre>${esc(JSON.stringify(lastJSON, null, 2))}</pre>
    </details>`;
}
function pager(meta, fnName) {
  if (!meta || !meta.totalPages || meta.totalPages <= 1) return '';
  return `
    <div class="pager">
      <button onclick="${fnName}(${Math.max(1, meta.page - 1)})" ${meta.page <= 1 ? 'disabled' : ''}>← önceki</button>
      <span>sayfa ${meta.page} / ${meta.totalPages} · ${meta.total} kayıt</span>
      <button onclick="${fnName}(${Math.min(meta.totalPages, meta.page + 1)})" ${meta.page >= meta.totalPages ? 'disabled' : ''}>sonraki →</button>
    </div>`;
}
function postCard(p) {
  const img = p.image || (p.media && p.media.url) || '';
  const author = p.author && typeof p.author === 'object' ? p.author.name : p.author;
  const cat = Array.isArray(p.categories) ? p.categories[0] : p.category;
  return `
    <div class="card" onclick="openArticle('${esc(p.slug)}')">
      ${img ? `<img src="${esc(img)}" loading="lazy" alt="">` : ''}
      <div class="body">
        ${cat ? `<div class="cat">${esc(cat)}</div>` : ''}
        <h3>${esc(p.title)}</h3>
        <div class="meta">
          ${author ? `<span>✍️ ${esc(author)}</span>` : ''}
          ${p.date ? `<span>📅 ${fmtDate(p.date)}</span>` : ''}
          ${p.readingTimeMinutes ? `<span>⏱️ ${p.readingTimeMinutes} dk</span>` : ''}
        </div>
      </div>
    </div>`;
}
function postsView(j) {
  const items = j.data || j.posts || [];
  if (!items.length) return '<div class="state"><div class="big">🗂️</div><h2>Sonuç yok</h2></div>';
  return `<div class="grid">${items.map(postCard).join('')}</div>${pager(j.meta)}`;
}

/* ---------- Views ---------- */
const SECTIONS = [
  { id:'latest', label:'📰 Haber' },
  { id:'videos', label:'🎬 Video' },
  { id:'gallery', label:'📷 Galeri' },
  { id:'reviews', label:'🔍 İnceleme' },
  { id:'howto', label:'🛠️ Nasıl Yapılır' },
];
let currentSection = 'latest', currentPage = 1;

const tabsEl = document.getElementById('tabs');
tabsEl.innerHTML = SECTIONS.map(s =>
  `<button class="tab ${s.id === currentSection ? 'active' : ''}" onclick="loadSection('${s.id}',1)">${s.label}</button>`
).join('');

function goHome() { loadSection(currentSection, 1); }

async function loadSection(id, page) {
  currentSection = id; currentPage = page;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.textContent.trim() === SECTIONS.find(s=>s.id===id).label));
  history.replaceState(null, '', '#' + id + (page > 1 ? '/' + page : ''));
  spinner();
  try {
    const j = await get(`/api/v1/${id}?page=${page}&per_page=12`);
    app.innerHTML = postsView(j) + devBlock();
  } catch (e) { failView(e); }
}

async function openArticle(slug) {
  spinner();
  try {
    const j = await get(`/api/v1/news/${slug}`);
    const a = j.data || j;
    const img = a.image || (a.seo && a.seo.ogImage) || '';
    const author = a.author && typeof a.author === 'object' ? a.author.name : a.author;
    let html = (a.contentHtml || a.plainText || a.excerpt || '');
    html = html.replace(/<script[\s\S]*?<\/script>/gi, '');
    app.innerHTML = `
      <div class="article">
        <button class="back" onclick="loadSection('${currentSection}', ${currentPage})">← geri</button>
        <h1>${esc(a.title)}</h1>
        <div class="meta">
          ${author ? `<span>✍️ ${esc(author)}</span>` : ''}
          ${a.date ? `<span>📅 ${fmtDate(a.date)}</span>` : ''}
          ${a.readingTimeMinutes ? `<span>⏱️ ${a.readingTimeMinutes} dk okuma</span>` : ''}
          ${Array.isArray(a.categories) && a.categories.length ? `<span>🏷️ ${esc(a.categories.join(', '))}</span>` : ''}
        </div>
        ${img ? `<img class="cover" src="${esc(img)}" alt="">` : ''}
        <div class="content">${html}</div>
        <p style="margin-top:20px"><a href="https://shiftdelete.net/${esc(slug)}" target="_blank" rel="noopener" style="color:var(--accent2)">Kaynağında oku →</a></p>
      </div>
      ${devBlock()}`;
    window.scrollTo(0, 0);
  } catch (e) { failView(e); }
}

async function doSearch(ev) {
  ev.preventDefault();
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  spinner();
  try {
    const j = await get(`/api/v1/search/posts?q=${encodeURIComponent(q)}&per_page=20`);
    app.innerHTML = `<h2 style="margin-top:6px">🔎 "${esc(q)}" için sonuçlar</h2>` + postsView(j) + devBlock();
  } catch (e) { failView(e); }
}

/* ---------- Boot ---------- */
const h = location.hash.replace('#', '').split('/');
if (h[0] && SECTIONS.some(s => s.id === h[0])) currentSection = h[0];
loadSection(currentSection, parseInt(h[1]) || 1);
checkConn();
</script>
</body>
</html>
