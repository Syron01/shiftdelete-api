<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShiftDelete</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root {
    --bg:#000000; --panel:#0a0b0d; --panel2:#101216;
    --line:#1b1e23; --line-h:#2c3138;
    --text:#e3e6ea; --dim:#87909b;
    --gold:#c8a35a;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { scrollbar-color:#22262c transparent; }
  body {
    background:var(--bg); color:var(--text);
    font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    font-size:15px; line-height:1.6;
    display:flex; justify-content:center; min-height:100vh;
  }
  button { font-family:inherit; background:none; border:none; color:inherit; cursor:pointer; }
  a { color:inherit; }
  ::-webkit-scrollbar { width:6px; } ::-webkit-scrollbar-thumb { background:#22262c; }
  .lucide { width:19px; height:19px; stroke-width:1.6; }

  .layout { display:flex; width:100%; max-width:1240px; }

  /* ================= LEFT NAV (PC) ================= */
  .side {
    width:230px; padding:20px 14px; position:sticky; top:0; height:100vh;
    display:flex; flex-direction:column; gap:2px;
    border-right:1px solid var(--line); flex-shrink:0;
  }
  .side .brand { display:flex; align-items:center; gap:12px; padding:8px 10px 22px; cursor:pointer; }
  .side .brand img { width:34px; height:34px; object-fit:contain; }
  .side .brand .bt { font-size:14px; font-weight:600; letter-spacing:.3px; }
  .navitem {
    display:flex; align-items:center; gap:14px; padding:11px 12px;
    color:var(--dim); font-size:14px; text-align:left;
    border-left:2px solid transparent; transition:color .15s;
  }
  .navitem:hover { color:var(--text); }
  .navitem.active { color:var(--text); border-left-color:var(--gold); }
  .navitem.active .lucide { color:var(--gold); }
  .side .foot { margin-top:auto; padding:12px; font-size:11px; color:var(--dim); line-height:1.9; }
  .side .foot a { text-decoration:none; }
  .side .foot a:hover { color:var(--text); }
  .setbtn {
    display:flex; align-items:center; gap:10px; padding:10px 12px; margin-bottom:8px;
    border:1px solid var(--line); color:var(--dim); font-size:12px;
  }
  .setbtn:hover { border-color:var(--line-h); color:var(--text); }
  .setbtn .st { width:7px; height:7px; background:#5c2e2e; }
  .setbtn.ok .st { background:var(--gold); }
  .setbtn.ok { color:var(--text); }

  @media (max-width:960px) { .side { display:none; } }

  /* ================= MOBILE TOP BAR ================= */
  .mbar {
    display:none; position:sticky; top:0; z-index:60;
    background:rgba(0,0,0,.9); backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
    padding:10px 14px; align-items:center; gap:12px;
  }
  .mbar img { width:28px; height:28px; object-fit:contain; cursor:pointer; }
  .mbar .ms {
    flex:1; display:flex; align-items:center; gap:10px;
    background:var(--panel); border:1px solid var(--line); padding:8px 12px;
  }
  .mbar .ms .lucide { width:15px; height:15px; color:var(--dim); }
  .mbar .ms input { flex:1; background:none; border:none; outline:none; color:var(--text); font-size:15px; font-family:inherit; }
  .mbar .setm { color:var(--dim); padding:6px; }
  .mbar .setm .st-dot { position:absolute; }
  .mnav {
    display:none; position:fixed; bottom:0; left:0; right:0; z-index:60;
    background:rgba(0,0,0,.94); backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
  }
  .mnav .in { display:flex; }
  .mnav button {
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:10px 4px 12px; color:var(--dim); font-size:10px;
    border-top:2px solid transparent;
  }
  .mnav button.active { color:var(--text); border-top-color:var(--gold); }
  .mnav button.active .lucide { color:var(--gold); }
  @media (max-width:960px) {
    .mbar { display:flex; }
    .mnav { display:block; }
    .layout { flex-direction:column; }
    main.feed { padding-bottom:70px; border-right:none; }
    .right { display:none !important; }
  }

  /* ================= FEED ================= */
  .feed { flex:1; max-width:640px; border-right:1px solid var(--line); min-height:100vh; width:0; }
  @media (min-width:961px) and (max-width:1240px) { .feed { border-right:none; } }
  .feedhead {
    position:sticky; top:0; z-index:20; background:rgba(0,0,0,.85); backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line); padding:14px 20px;
    display:flex; align-items:center; gap:14px;
  }
  @media (max-width:960px) { .feedhead { top:53px; } }
  .feedhead .tt {
    flex:1; font-size:12px; letter-spacing:4px; text-transform:uppercase;
    font-family:ui-monospace,Menlo,Consolas,monospace; color:var(--dim); font-weight:400;
  }
  .backbtn { color:var(--dim); display:none; padding:4px; }
  .backbtn:hover { color:var(--text); }
  .backbtn.show { display:flex; }

  /* ---------- Post card ---------- */
  .post {
    display:flex; gap:14px; padding:20px; border-bottom:1px solid var(--line);
    cursor:pointer; transition:background .15s; animation:rise .45s ease-out both;
  }
  @media (prefers-reduced-motion:reduce) { .post { animation:none; } }
  @keyframes rise { from { opacity:0; transform:translateY(12px); } }
  .post:hover { background:var(--panel); }
  .post .av {
    width:38px; height:38px; border:1px solid var(--line); flex-shrink:0; overflow:hidden;
    display:flex; align-items:center; justify-content:center; color:var(--dim);
  }
  .post .av img { width:100%; height:100%; object-fit:cover; }
  .post .body { flex:1; min-width:0; }
  .post .who {
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px;
    letter-spacing:1.5px; text-transform:uppercase; color:var(--dim);
    display:flex; gap:10px; flex-wrap:wrap; margin-bottom:5px;
  }
  .post .who b { color:var(--text); font-weight:500; }
  .post .cat { color:var(--gold); }
  .post .txt { font-size:16px; line-height:1.4; letter-spacing:-.01em; }
  .post .excerpt {
    color:var(--dim); font-size:13px; margin-top:5px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .post .pic { margin-top:12px; border:1px solid var(--line); }
  .post .pic img { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; }
  .post .acts {
    display:flex; gap:20px; margin-top:12px; color:var(--dim);
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:10.5px; letter-spacing:1px;
  }
  .post .acts span { display:flex; align-items:center; gap:6px; }
  .post .acts .lucide { width:12px; height:12px; }

  .state { padding:80px 20px; text-align:center; color:var(--dim); }
  .state h3 {
    color:var(--text); font-size:12px; letter-spacing:4px; text-transform:uppercase;
    font-family:ui-monospace,Menlo,Consolas,monospace; font-weight:400; margin-bottom:8px;
  }
  .spin {
    width:24px; height:24px; border:1px solid var(--line); border-top-color:var(--gold);
    border-radius:50%; animation:r .9s linear infinite; margin:0 auto 18px;
  }
  @keyframes r { to { transform:rotate(360deg); } }
  .more {
    display:block; width:100%; padding:16px; border-bottom:1px solid var(--line);
    color:var(--dim); font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:11px; letter-spacing:3px; text-transform:uppercase;
  }
  .more:hover { color:var(--text); background:var(--panel); }

  /* ---------- Article ---------- */
  .article { padding:24px 20px 50px; animation:rise .45s ease-out both; }
  .article .kick {
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px;
    letter-spacing:3px; text-transform:uppercase; color:var(--gold); margin-bottom:12px;
  }
  .article h1 { font-size:clamp(24px, 4.5vw, 36px); line-height:1.2; letter-spacing:-.02em; margin-bottom:14px; }
  .article .meta {
    display:flex; gap:18px; color:var(--dim); font-size:12px; flex-wrap:wrap; margin-bottom:22px;
    font-family:ui-monospace,Menlo,Consolas,monospace;
  }
  .article .cover { width:100%; border:1px solid var(--line); margin-bottom:22px; }
  .article .content { line-height:1.8; font-size:15.5px; max-width:68ch; }
  .article .content p { margin-bottom:17px; }
  .article .content img { max-width:100%; border:1px solid var(--line); margin:6px 0; }
  .article .content a { color:var(--gold); text-decoration:none; }
  .article .content h2,.article .content h3 { margin:22px 0 10px; letter-spacing:-.01em; }
  .article .content ul,.article .content ol { margin:0 0 17px 22px; }
  .srcbtn {
    display:inline-flex; align-items:center; gap:9px; margin-top:22px;
    background:var(--text); color:#000; text-decoration:none; padding:11px 20px; font-size:13px; font-weight:600;
  }
  .srcbtn:hover { background:#fff; }
  .relhead {
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px;
    letter-spacing:3px; text-transform:uppercase; color:var(--dim);
    padding:22px 20px 6px; border-top:1px solid var(--line);
  }

  /* ================= RIGHT (PC) ================= */
  .right { width:340px; padding:20px; flex-shrink:0; display:none; }
  @media (min-width:1241px) { .right { display:block; } }
  .right .box { position:sticky; top:0; }
  .searchwrap {
    display:flex; align-items:center; gap:11px; padding:10px 13px;
    background:var(--panel); border:1px solid var(--line); margin-bottom:24px;
  }
  .searchwrap:focus-within { border-color:var(--line-h); }
  .searchwrap .lucide { color:var(--dim); }
  .searchwrap input { flex:1; background:none; border:none; outline:none; color:var(--text); font-size:14px; font-family:inherit; }
  .searchwrap input::placeholder { color:var(--dim); }
  .widget { border-top:1px solid var(--line); padding-top:16px; margin-bottom:24px; }
  .widget h2 {
    font-size:11px; font-weight:400; letter-spacing:3px; text-transform:uppercase;
    font-family:ui-monospace,Menlo,Consolas,monospace; color:var(--dim); margin-bottom:12px;
  }
  .trow { padding:10px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .trow:last-child { border-bottom:none; }
  .trow:hover .n { color:var(--text); }
  .trow .k { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:10px; color:var(--dim); letter-spacing:1px; }
  .trow .n { font-size:13px; color:var(--dim); margin:2px 0 0; line-height:1.45; transition:color .15s; }
</style>
</head>
<body>

<!-- Mobile top bar -->
<div class="mbar">
  <img src="logo.png" alt="ShiftDelete" onclick="go('latest')">
  <div class="ms">
    <i data-lucide="search"></i>
    <input id="qm" placeholder="Ara" onkeydown="if(event.key==='Enter')doSearch('qm')">
  </div>
  <button class="setm" onclick="connModal()"><i data-lucide="settings-2"></i></button>
</div>

<div class="layout">

  <!-- PC left nav -->
  <nav class="side">
    <div class="brand" onclick="go('latest')">
      <img src="logo.png" alt="">
      <span class="bt">ShiftDelete</span>
    </div>
    <button class="navitem active" data-id="latest" onclick="go('latest')"><i data-lucide="house"></i><span>Akış</span></button>
    <button class="navitem" data-id="videos" onclick="go('videos')"><i data-lucide="play"></i><span>Video</span></button>
    <button class="navitem" data-id="gallery" onclick="go('gallery')"><i data-lucide="image"></i><span>Galeri</span></button>
    <button class="navitem" data-id="reviews" onclick="go('reviews')"><i data-lucide="star"></i><span>İnceleme</span></button>
    <button class="navitem" data-id="howto" onclick="go('howto')"><i data-lucide="wrench"></i><span>Nasıl Yapılır</span></button>
    <div style="margin-top:auto">
      <button class="setbtn" id="conn" onclick="connModal()">
        <span class="st"></span><span id="connText">bağlanıyor</span>
      </button>
      <div class="foot">
        Resmi değildir · içerik hakları<br>
        <a href="https://shiftdelete.net" target="_blank" rel="noopener">shiftdelete.net</a>'e aittir
      </div>
    </div>
  </nav>

  <!-- Feed -->
  <main class="feed">
    <div class="feedhead">
      <button class="backbtn" id="backBtn" onclick="go(curSection)"><i data-lucide="arrow-left"></i></button>
      <span class="tt" id="feedTitle">akış</span>
    </div>
    <div id="feed"><div class="state"><div class="spin"></div></div></div>
  </main>

  <!-- Right -->
  <aside class="right">
    <div class="box">
      <div class="searchwrap">
        <i data-lucide="search"></i>
        <input id="q" placeholder="Ara" onkeydown="if(event.key==='Enter')doSearch('q')">
      </div>
      <div class="widget" id="trend" style="display:none">
        <h2>son başlıklar</h2>
        <div id="trendRows"></div>
      </div>
      <div class="widget">
        <h2>keşfet</h2>
        <div class="trow" onclick="go('videos')"><div class="k">bölüm</div><div class="n">SDN TV videoları</div></div>
        <div class="trow" onclick="go('reviews')"><div class="k">bölüm</div><div class="n">Ürün incelemeleri</div></div>
        <div class="trow" onclick="go('gallery')"><div class="k">bölüm</div><div class="n">Foto galeriler</div></div>
        <div class="trow" onclick="go('howto')"><div class="k">bölüm</div><div class="n">Nasıl yapılır rehberleri</div></div>
      </div>
    </div>
  </aside>
</div>

<!-- Mobile bottom nav -->
<nav class="mnav"><div class="in">
  <button class="active" data-id="latest" onclick="go('latest')"><i data-lucide="house"></i><span>Akış</span></button>
  <button data-id="videos" onclick="go('videos')"><i data-lucide="play"></i><span>Video</span></button>
  <button data-id="gallery" onclick="go('gallery')"><i data-lucide="image"></i><span>Galeri</span></button>
  <button data-id="reviews" onclick="go('reviews')"><i data-lucide="star"></i><span>İnceleme</span></button>
  <button data-id="howto" onclick="go('howto')"><i data-lucide="wrench"></i><span>Rehber</span></button>
</div></nav>

<script>
let BASE = '';
const isStatic = !!(location.hostname.endsWith('.github.io') || location.protocol === 'file:');
if (isStatic) BASE = (localStorage.getItem('apiBase') || 'http://localhost:3000').replace(/\/+$/, '');
const api = p => BASE + p;

const feed = document.getElementById('feed');
const TITLES = { latest:'akış', videos:'video', gallery:'galeri', reviews:'inceleme', howto:'nasıl yapılır' };
const NAVICON = { latest:'newspaper', videos:'play', gallery:'image', reviews:'star', howto:'wrench' };
let curSection = 'latest', page = 1, items = [], lastJSON = null, lastURL = '';

const icons = () => { try { lucide.createIcons(); } catch {} };

async function get(p) {
  lastURL = api(p);
  const r = await fetch(lastURL);
  const j = await r.json();
  lastJSON = j;
  if (!r.ok) throw new Error((j && j.error) || '');
  return j;
}
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const relTime = d => {
  if (!d) return '';
  const diff = (Date.now() - new Date(d)) / 1000;
  if (isNaN(diff)) return '';
  if (diff < 3600) return Math.max(1, Math.floor(diff / 60)) + ' dk önce';
  if (diff < 86400) return Math.floor(diff / 3600) + ' sa önce';
  if (diff < 86400 * 7) return Math.floor(diff / 86400) + ' gün önce';
  return new Date(d).toLocaleDateString('tr-TR', { day:'numeric', month:'long' });
};
const authorName = p => p.author && typeof p.author === 'object' ? p.author.name : p.author;
const catName = p => Array.isArray(p.categories) && p.categories[0]
  ? (typeof p.categories[0] === 'object' ? p.categories[0].name : p.categories[0]) : '';

function postCard(p, i) {
  const img = p.image || '';
  const av = p.author && p.author.avatar ? `<img src="${esc(p.author.avatar)}" alt="">` : `<i data-lucide="newspaper"></i>`;
  return `
  <article class="post" style="animation-delay:${Math.min(i,8)*55}ms" onclick="openArticle('${esc(p.slug)}')">
    <div class="av">${av}</div>
    <div class="body">
      <div class="who">
        <b>${esc(authorName(p) || 'ShiftDelete')}</b>
        <span>${relTime(p.date)}</span>
        ${catName(p) ? `<span class="cat">${esc(catName(p))}</span>` : ''}
      </div>
      <div class="txt">${esc(p.title)}</div>
      ${p.excerpt ? `<div class="excerpt">${esc(p.excerpt)}</div>` : ''}
      ${img ? `<div class="pic"><img src="${esc(img)}" loading="lazy" alt=""></div>` : ''}
      <div class="acts">
        <span><i data-lucide="clock"></i>${p.readingTimeMinutes || 3} dk</span>
        <span><i data-lucide="arrow-up-right"></i>okuma</span>
      </div>
    </div>
  </article>`;
}

function setNav(id) {
  document.querySelectorAll('.navitem,.mnav button').forEach(n => n.classList.toggle('active', n.dataset.id === id));
  document.getElementById('feedTitle').textContent = TITLES[id] || 'arama';
}
function fail() {
  checkConn();
  feed.innerHTML = `
    <div class="state">
      <h3>bağlantı yok</h3>
      <p style="font-size:13px;margin-top:8px">Ayarlar düğmesinden sunucu adresini girebilirsin.</p>
    </div>`;
}

async function go(id, pg) {
  curSection = id; page = pg || 1; items = [];
  setNav(id);
  document.getElementById('backBtn').classList.remove('show');
  feed.innerHTML = '<div class="state"><div class="spin"></div></div>';
  history.replaceState(null, '', '#' + id);
  window.scrollTo(0, 0);
  try {
    const j = await get(`/api/v1/${id}?page=${page}&per_page=12`);
    items = j.data || [];
    renderList(j);
  } catch { fail(); }
}
function renderList(j) {
  feed.innerHTML = items.length
    ? items.map(postCard).join('') +
      (j.meta && j.meta.page < j.meta.totalPages ? `<button class="more" onclick="go('${curSection}', ${page+1})">daha fazla</button>` : '')
    : '<div class="state"><h3>sonuç yok</h3></div>';
  icons();
}

async function doSearch(id) {
  const q = document.getElementById(id).value.trim();
  if (!q) return;
  document.querySelectorAll('.navitem,.mnav button').forEach(n => n.classList.remove('active'));
  document.getElementById('feedTitle').textContent = 'arama';
  document.getElementById('backBtn').classList.add('show');
  feed.innerHTML = '<div class="state"><div class="spin"></div></div>';
  try {
    const j = await get(`/api/v1/search/posts?q=${encodeURIComponent(q)}&per_page=20`);
    items = j.data || j.posts || [];
    renderList(j);
  } catch { fail(); }
}

async function openArticle(slug) {
  feed.innerHTML = '<div class="state"><div class="spin"></div></div>';
  document.getElementById('backBtn').classList.add('show');
  document.getElementById('feedTitle').textContent = 'haber';
  try {
    const j = await get(`/api/v1/news/${slug}`);
    const a = j.data || j;
    const img = a.image || (a.seo && a.seo.ogImage) || '';
    let html = (a.contentHtml || a.plainText || a.excerpt || '').replace(/<script[\s\S]*?<\/script>/gi, '');
    feed.innerHTML = `
      <div class="article">
        <div class="kick">${esc(authorName(a) || 'ShiftDelete')}</div>
        <h1>${esc(a.title)}</h1>
        <div class="meta">
          <span>${a.date ? new Date(a.date).toLocaleDateString('tr-TR', { day:'numeric', month:'long', year:'numeric' }) : ''}</span>
          ${a.readingTimeMinutes ? `<span>${a.readingTimeMinutes} dk okuma</span>` : ''}
          ${Array.isArray(a.categories) && a.categories.length
            ? `<span>${esc(a.categories.map(c => typeof c === 'object' ? c.name : c).join(' / '))}</span>` : ''}
        </div>
        ${img ? `<img class="cover" src="${esc(img)}" alt="">` : ''}
        <div class="content">${html}</div>
        <a class="srcbtn" href="https://shiftdelete.net/${esc(slug)}" target="_blank" rel="noopener">
          Kaynağında oku <i data-lucide="arrow-up-right"></i>
        </a>
      </div>`;
    window.scrollTo(0, 0);
    icons();
    loadRelated(slug);
  } catch { fail(); }
}

async function loadRelated(slug) {
  try {
    const j = await get(`/api/v1/news/${slug}/related`);
    const rel = j.data || [];
    if (!rel.length) return;
    const div = document.createElement('div');
    div.innerHTML = `
      <div class="relhead">benzer haberler</div>
      ${rel.map((p, i) => postCard(p, i)).join('')}`;
    feed.appendChild(div);
    icons();
  } catch {}
}

async function loadTrend() {
  try {
    const j = await get('/api/v1/latest?per_page=6');
    document.getElementById('trendRows').innerHTML = (j.data || []).map(p => `
      <div class="trow" onclick="openArticle('${esc(p.slug)}')">
        <div class="k">${relTime(p.date)}</div>
        <div class="n">${esc(p.title.length > 74 ? p.title.slice(0, 74) + '…' : p.title)}</div>
      </div>`).join('');
    document.getElementById('trend').style.display = '';
  } catch {}
}

async function checkConn() {
  const el = document.getElementById('conn'), t = document.getElementById('connText');
  try {
    const r = await fetch(api('/api/v1/health'), { signal: AbortSignal.timeout(4000) });
    if (!r.ok) throw 0;
    el.classList.add('ok'); t.textContent = 'çevrimiçi';
  } catch {
    el.classList.remove('ok');
    t.textContent = 'çevrimdışı';
  }
}
function connModal() {
  const cur = isStatic ? (localStorage.getItem('apiBase') || 'http://localhost:3000') : '';
  const v = prompt(
    isStatic ? 'Sunucu adresi (örn. http://localhost:3000)' : 'Sunucu adresi',

  if (v !== null && isStatic) { localStorage.setItem('apiBase', v.trim().replace(/\/+$/, '')); location.reload(); }
